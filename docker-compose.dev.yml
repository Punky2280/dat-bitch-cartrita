version: '3.9'
services:
  # PostgreSQL Database with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: cartrita-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: robert
      POSTGRES_PASSWORD: punky1
      POSTGRES_DB: dat-bitch-cartrita
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    networks:
      - cartrita-network-dev
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c log_statement=all
      -c log_destination=stderr
      -c logging_collector=on
      -c log_min_messages=info

  # Redis for development
  redis:
    image: redis:7-alpine
    container_name: cartrita-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    networks:
      - cartrita-network-dev
    command: redis-server --appendonly yes

  # OpenTelemetry Collector (dev)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: cartrita-otel-collector-dev
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yml"]
    environment:
      OTEL_EXPORTER_OTLP_HTTP_ENDPOINT: "${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
      - "1777:1777"
      - "55679:55679"
    networks:
      - cartrita-network-dev

  # Backend dev override via backend container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartrita-backend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-dg-placeholder}
      - LIGHTWEIGHT_TEST=1
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=robert
      - POSTGRES_PASSWORD=punky1
      - POSTGRES_DB=dat-bitch-cartrita
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://robert:punky1@db:5432/dat-bitch-cartrita
      - ENABLE_TELEMETRY=false
      - ENABLE_WORKFLOW_ENGINE=false
      - ENABLE_MULTIMODAL_FUSION=false
      - ENABLE_SECURITY_AUDIT=false
    env_file:
      - packages/backend/.env
    volumes:
      - ./packages/backend:/usr/src/app/packages/backend
      - ./packages/backend/uploads:/usr/src/app/packages/backend/uploads
      - ./packages/backend/logs:/usr/src/app/packages/backend/logs
      - /usr/src/app/packages/backend/node_modules
    networks:
      - cartrita-network-dev
    depends_on:
      - db
      - redis
      - otel-collector
    ports:
      - "8001:8001"
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend dev service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cartrita-frontend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://localhost:8001
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/public:/app/public
      - ./packages/frontend/index.html:/app/index.html
      - ./packages/frontend/vite.config.ts:/app/vite.config.ts
      - ./packages/frontend/tailwind.config.js:/app/tailwind.config.js
      - ./packages/frontend/postcss.config.js:/app/postcss.config.js
      - ./packages/frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    networks:
      - cartrita-network-dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  cartrita-network-dev:
    driver: bridge
