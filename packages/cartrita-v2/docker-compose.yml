

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cartrita-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: robert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: dat-bitch-cartrita
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db-init:/docker-entrypoint-initdb.d
    networks:
      - cartrita-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U robert -d dat-bitch-cartrita']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cartrita-v2-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - cartrita-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Python Backend Service (AI Agents + FastAPI)
  python-backend:
    build:
      context: ./py
      dockerfile: Dockerfile
    container_name: cartrita-v2-python
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      PORT: 8000
      
      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-cartrita_user}:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/${POSTGRES_DB:-dat_bitch_cartrita}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: robert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: dat-bitch-cartrita
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # ML/AI Cache directories
      TORCH_HOME: /app/.cache/torch
      TRANSFORMERS_CACHE: /app/.cache/transformers
      
      # Computer use settings (headless)
      DISPLAY: ':99'
      
    env_file:
      - .env
    ports:
      - '8000:8000'
    volumes:
      - ./py:/app
      - ml_cache:/app/.cache
    networks:
      - cartrita-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: cartrita-v2-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # API URLs pointing to Python backend only
      # Use localhost for browser (client-side) access
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_PYTHON_API_BASE_URL: http://localhost:8000
      # Use service name for server-side (SSR) access from inside the container
      PYTHON_API_BASE_URL: http://python-backend:8000
      TURBOPACK: 1
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - frontend_next_cache:/app/.next
    networks:
      - cartrita-network
    depends_on:
      - python-backend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ml_cache:
    driver: local
  frontend_next_cache:
    driver: local

networks:
  cartrita-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16