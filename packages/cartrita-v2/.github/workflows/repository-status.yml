name: 🔍 Repository Status Check

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      check_level:
        description: 'Check Level'
        required: true
        default: 'standard'
        type: choice
        options:
          - 'quick'
          - 'standard' 
          - 'comprehensive'

jobs:
  # ========================================
  # 🏥 System Health Check
  # ========================================
  health-check:
    name: 🏥 System Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    outputs:
      python-health: ${{ steps.python.outputs.status }}
      docker-health: ${{ steps.docker.outputs.status }}
      workflow-health: ${{ steps.workflows.outputs.status }}
      dependencies-health: ${{ steps.deps.outputs.status }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load .env variables
        run: |
          if [ -f .env ]; then
            echo "Loading .env into GITHUB_ENV"
            while IFS= read -r line; do
              if [ -n "$line" ] && [ "${line#\#}" = "$line" ] && [[ "$line" == *"="* ]]; then
                key="${line%%=*}"
                value="${line#*=}"
                value="${value%\"}"; value="${value#\"}"
                value="${value%\'}"; value="${value#\'}"
                echo "$key=$value" >> "$GITHUB_ENV"
              fi
            done < .env
          else
            echo ".env not found; skipping"
          fi

      - name: Python environment health check
        id: python
        run: |
          echo "🐍 Checking Python environment..."
          
          if [[ -f "py/requirements.txt" ]]; then
            REQ_COUNT=$(wc -l < py/requirements.txt)
            echo "📦 Found $REQ_COUNT Python dependencies"
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "❌ No requirements.txt found"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi
          
          # Check for critical Python files
          CRITICAL_FILES=("py/copilot_delegation_agent.py" "py/mcp_tools_server.py")
          for file in "${CRITICAL_FILES[@]}"; do
            if [[ -f "$file" ]]; then
              echo "✅ $file exists"
            else
              echo "⚠️ $file missing"
            fi
          done

      - name: Docker configuration health check
        id: docker
        run: |
          echo "🐳 Checking Docker configuration..."
          
          if [[ -f "Dockerfile.python" ]]; then
            echo "✅ Dockerfile.python exists"
          else
            echo "❌ Dockerfile.python missing"
          fi
          
          if [[ -f "docker-compose.python-only.yml" ]]; then
            echo "✅ Docker Compose configuration exists"
            
            # Check for required services
            if grep -q "cartrita-db:" docker-compose.python-only.yml; then
              echo "✅ Database service configured"
            fi
            
            if grep -q "cartrita-redis:" docker-compose.python-only.yml; then
              echo "✅ Redis service configured"
            fi
            
            if grep -q "cartrita-backend:" docker-compose.python-only.yml; then
              echo "✅ Backend service configured"
            fi
            
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "❌ Docker Compose configuration missing"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: GitHub workflows health check
        id: workflows
        run: |
          echo "⚙️ Checking GitHub workflows..."
          
          if [[ -d ".github/workflows" ]]; then
            WORKFLOW_COUNT=$(find .github/workflows -name "*.yml" -o -name "*.yaml" | wc -l)
            echo "📄 Found $WORKFLOW_COUNT workflow files"
            
            # Check for empty workflows (our previous issue)
            EMPTY_COUNT=0
            for file in .github/workflows/*.yml; do
              if [[ -f "$file" && ! -s "$file" ]]; then
                echo "⚠️ Empty workflow file: $file"
                EMPTY_COUNT=$((EMPTY_COUNT + 1))
              fi
            done
            
            if [[ $EMPTY_COUNT -eq 0 ]]; then
              echo "✅ All workflows have content"
              echo "status=healthy" >> $GITHUB_OUTPUT
            else
              echo "❌ Found $EMPTY_COUNT empty workflow files"
              echo "status=unhealthy" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ No workflows directory found"
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Dependencies security check
        id: deps
        run: |
          echo "🔒 Checking dependencies for security issues..."
          
          if [[ -f "py/requirements.txt" ]]; then
            # Install safety for security checking
            pip install safety
            
            # Check for known vulnerabilities
            if safety check -r py/requirements.txt --json > safety-report.json; then
              echo "✅ No known vulnerabilities found"
              echo "status=healthy" >> $GITHUB_OUTPUT
            else
              VULN_COUNT=$(jq length safety-report.json 2>/dev/null || echo "unknown")
              echo "⚠️ Found $VULN_COUNT potential security issues"
              echo "status=warning" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ No requirements.txt to check"
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi

  # ========================================
  # 📊 Project Statistics
  # ========================================
  project-stats:
    name: 📊 Project Statistics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate project statistics
        run: |
          echo "📈 Generating project statistics..."
          
          # File counts
          PYTHON_FILES=$(find . -name "*.py" | wc -l)
          YAML_FILES=$(find . -name "*.yml" -o -name "*.yaml" | wc -l)
          JSON_FILES=$(find . -name "*.json" | wc -l)
          MD_FILES=$(find . -name "*.md" | wc -l)
          
          echo "📁 File Statistics:"
          echo "  - Python files: $PYTHON_FILES"
          echo "  - YAML files: $YAML_FILES" 
          echo "  - JSON files: $JSON_FILES"
          echo "  - Markdown files: $MD_FILES"
          
          # Code statistics
          if command -v wc >/dev/null 2>&1; then
            TOTAL_LINES=$(find . -name "*.py" -exec wc -l {} + 2>/dev/null | tail -1 | awk '{print $1}' || echo "0")
            echo "📝 Total Python lines: $TOTAL_LINES"
          fi
          
          # Git statistics
          if [[ -d ".git" ]]; then
            COMMIT_COUNT=$(git rev-list --all --count 2>/dev/null || echo "unknown")
            BRANCH_COUNT=$(git branch -r 2>/dev/null | wc -l || echo "unknown")
            echo "🔀 Git Statistics:"
            echo "  - Total commits: $COMMIT_COUNT"
            echo "  - Remote branches: $BRANCH_COUNT"
          fi
          
          # Docker image info
          if [[ -f "Dockerfile.python" ]]; then
            BASE_IMAGE=$(grep "^FROM" Dockerfile.python | head -1 | cut -d' ' -f2 || echo "unknown")
            echo "🐳 Docker base image: $BASE_IMAGE"
          fi

      - name: Generate README stats
        run: |
          echo "📚 Documentation Statistics:"
          
          if [[ -f "README.md" ]]; then
            README_LINES=$(wc -l < README.md)
            echo "  - README.md lines: $README_LINES"
          else
            echo "  - README.md: Missing"
          fi
          
          DOC_FILES=$(find . -name "*.md" -not -path "./.git/*")
          echo "  - Documentation files:"
          echo "$DOC_FILES" | while read file; do
            if [[ -n "$file" ]]; then
              echo "    - $file"
            fi
          done

  # ========================================
  # 🔧 Configuration Validation
  # ========================================
  config-validation:
    name: 🔧 Configuration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          echo "📦 Validating package.json..."
          
          if [[ -f "package.json" ]]; then
            # Check JSON syntax
            if jq . package.json > /dev/null 2>&1; then
              echo "✅ package.json syntax valid"
              
              # Extract key information
              NAME=$(jq -r '.name' package.json)
              VERSION=$(jq -r '.version' package.json)
              DESCRIPTION=$(jq -r '.description' package.json)
              
              echo "📋 Package Information:"
              echo "  - Name: $NAME"
              echo "  - Version: $VERSION"
              echo "  - Description: $DESCRIPTION"
              
              # Check scripts
              SCRIPT_COUNT=$(jq '.scripts | length' package.json)
              echo "  - Scripts defined: $SCRIPT_COUNT"
              
            else
              echo "❌ package.json syntax invalid"
            fi
          else
            echo "⚠️ No package.json found"
          fi

      - name: Validate Docker configurations
        run: |
          echo "🐳 Validating Docker configurations..."
          
          if [[ -f "docker-compose.python-only.yml" ]]; then
            # Basic YAML syntax check
            python3 -c "
            import yaml
            try:
                with open('docker-compose.python-only.yml', 'r') as f:
                    yaml.safe_load(f)
                print('✅ docker-compose.python-only.yml syntax valid')
            except Exception as e:
                print(f'❌ docker-compose.python-only.yml syntax error: {e}')
            "
          fi
          
          if [[ -f "Dockerfile.python" ]]; then
            echo "✅ Dockerfile.python exists"
            
            # Check for common Dockerfile patterns
            if grep -q "FROM python:" Dockerfile.python; then
              echo "✅ Uses Python base image"
            fi
            
            if grep -q "COPY.*requirements.txt" Dockerfile.python; then
              echo "✅ Copies requirements.txt"
            fi
            
            if grep -q "RUN.*pip install" Dockerfile.python; then
              echo "✅ Installs Python dependencies"
            fi
          fi

      - name: Validate workflow configurations
        run: |
          echo "⚙️ Validating GitHub workflow configurations..."
          
          for workflow in .github/workflows/*.yml; do
            if [[ -f "$workflow" && -s "$workflow" ]]; then
              echo "✅ $(basename "$workflow") - has content"
              
              # Check for required fields
              if grep -q "name:" "$workflow"; then
                echo "  ✅ Has name field"
              else
                echo "  ⚠️ Missing name field"
              fi
              
              if grep -q "on:" "$workflow"; then
                echo "  ✅ Has trigger configuration"
              else
                echo "  ⚠️ Missing trigger configuration"
              fi
              
              if grep -q "jobs:" "$workflow"; then
                echo "  ✅ Has jobs defined"
              else
                echo "  ⚠️ No jobs defined"
              fi
              
            elif [[ -f "$workflow" ]]; then
              echo "❌ $(basename "$workflow") - empty file"
            fi
          done

  # ========================================
  # 📋 Status Summary Report
  # ========================================
  status-report:
    name: 📋 Status Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [health-check, project-stats, config-validation]
    if: always()
    
    steps:
      - name: Generate comprehensive status report
        run: |
          echo "# 🔍 Cartrita V2 - Repository Status Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🏥 System Health Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Environment | ${{ needs.health-check.outputs.python-health || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Configuration | ${{ needs.health-check.outputs.docker-health || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Workflows | ${{ needs.health-check.outputs.workflow-health || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies Security | ${{ needs.health-check.outputs.dependencies-health || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🎯 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check:** ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project Statistics:** ${{ needs.project-stats.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration Validation:** ${{ needs.config-validation.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall health assessment
          PYTHON_OK="${{ needs.health-check.outputs.python-health }}"
          DOCKER_OK="${{ needs.health-check.outputs.docker-health }}"
          WORKFLOW_OK="${{ needs.health-check.outputs.workflow-health }}"
          
          if [[ "$PYTHON_OK" == "healthy" && "$DOCKER_OK" == "healthy" && "$WORKFLOW_OK" == "healthy" ]]; then
            echo "## 🎉 Overall Status: HEALTHY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All critical systems are functioning properly!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Overall Status: NEEDS ATTENTION" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some components require attention. Please review the detailed logs." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Quick Actions" >> $GITHUB_STEP_SUMMARY
          echo "- [🧪 Run Smoke Tests](../../actions/workflows/smoke-tests.yml)" >> $GITHUB_STEP_SUMMARY
          echo "- [🚀 Start Deployment](../../actions/workflows/deployment.yml)" >> $GITHUB_STEP_SUMMARY
          echo "- [🔧 Advanced Testing](../../actions/workflows/advanced-testing.yml)" >> $GITHUB_STEP_SUMMARY
          echo "- [📦 Create Release](../../actions/workflows/release.yml)" >> $GITHUB_STEP_SUMMARY

      - name: Status check conclusion
        run: |
          echo "Repository status check completed!"
          echo "Check Level: ${{ github.event.inputs.check_level || 'standard' }}"
          
          # Determine exit code based on health checks
          if [[ "${{ needs.health-check.result }}" == "success" && 
                "${{ needs.config-validation.result }}" == "success" ]]; then
            echo "✅ Repository is in good health!"
            exit 0
          else
            echo "⚠️ Repository needs attention - check the summary above"
            exit 0  # Don't fail the workflow, just report
          fi