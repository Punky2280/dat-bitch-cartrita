name: 🚀 Release Pipeline

on:
  push:
    tags:
      - 'v*'
      - 'release/*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'
          - 'prerelease'
      skip_tests:
        description: 'Skip comprehensive tests'
        required: false
        default: false
        type: boolean
      docker_platforms:
        description: 'Docker platforms to build'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      create_github_release:
        description: 'Create GitHub release'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cartrita-v2
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ========================================
  # 🏷️ Version & Release Preparation
  # ========================================
  prepare-release:
    name: 🏷️ Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      should-deploy: ${{ steps.version.outputs.should-deploy }}
      release-notes: ${{ steps.notes.outputs.release-notes }}
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js for versioning
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Determine version and tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual release - determine next version
            CURRENT_VERSION=$(jq -r '.version' package.json)
            echo "Current version: $CURRENT_VERSION"
            
            case "${{ github.event.inputs.release_type }}" in
              "major")
                NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print ($1+1)".0.0"}')
                ;;
              "minor")
                NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1".".($2+1)".0"}')
                ;;
              "patch")
                NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{print $1"."$2".".($3+1)}')
                ;;
              "prerelease")
                NEW_VERSION="${CURRENT_VERSION}-pre.$(date +%Y%m%d%H%M%S)"
                ;;
            esac
            
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            
            if [[ "${{ github.event.inputs.release_type }}" == "prerelease" ]]; then
              echo "is-prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is-prerelease=false" >> $GITHUB_OUTPUT
            fi
            
          elif [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            # Tag-based release
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            
            if [[ "$VERSION" =~ (alpha|beta|rc|pre) ]]; then
              echo "is-prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is-prerelease=false" >> $GITHUB_OUTPUT
            fi
            
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            # GitHub release event
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "is-prerelease=${{ github.event.release.prerelease }}" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          NEW_VERSION="${{ steps.version.outputs.version }}"
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "Updated package.json to version $NEW_VERSION"

      - name: Generate release notes
        id: notes
        run: |
          echo "Generating release notes for ${{ steps.version.outputs.version }}..."
          
          # Get commits since last release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [[ -n "$LAST_TAG" ]]; then
            COMMIT_RANGE="${LAST_TAG}..HEAD"
          else
            COMMIT_RANGE="HEAD~10..HEAD"
          fi
          
          # Generate changelog
          RELEASE_NOTES=$(cat << 'EOF'
          ## 🚀 Cartrita V2 Release ${{ steps.version.outputs.version }}
          
          ### 🎯 What's New
          EOF
          )
          
          # Add commit messages
          git log $COMMIT_RANGE --oneline --grep="feat:" --grep="fix:" --grep="chore:" --grep="docs:" | while read line; do
            if [[ $line =~ feat: ]]; then
              echo "- ✨ ${line#* }" >> release_notes.md
            elif [[ $line =~ fix: ]]; then
              echo "- 🐛 ${line#* }" >> release_notes.md
            elif [[ $line =~ chore: ]]; then
              echo "- 🔧 ${line#* }" >> release_notes.md
            elif [[ $line =~ docs: ]]; then
              echo "- 📚 ${line#* }" >> release_notes.md
            fi
          done
          
          # Add component information
          echo "" >> release_notes.md
          echo "### 🧩 Components" >> release_notes.md
          echo "- **Python Backend**: FastAPI + AI Agents" >> release_notes.md
          echo "- **MCP Tools Server**: Model Context Protocol integration" >> release_notes.md
          echo "- **GitHub Copilot Agent**: Automated development assistance" >> release_notes.md
          echo "- **Docker Support**: Production-ready containerization" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🔧 Technical Details" >> release_notes.md
          echo "- **Python**: ${{ env.PYTHON_VERSION }}" >> release_notes.md
          echo "- **Node.js**: ${{ env.NODE_VERSION }}" >> release_notes.md
          echo "- **Docker**: Multi-architecture support (amd64, arm64)" >> release_notes.md
          
          # Set output for GitHub Actions
          {
            echo 'release-notes<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Commit version changes
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "🔖 Bump version to ${{ steps.version.outputs.version }}" || exit 0
          git tag ${{ steps.version.outputs.tag }}

      - name: Push changes and tags
        if: github.event_name == 'workflow_dispatch'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

  # ========================================
  # 🧪 Pre-Release Testing
  # ========================================
  pre-release-tests:
    name: 🧪 Pre-Release Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare-release
    if: ${{ !github.event.inputs.skip_tests }}
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    strategy:
      matrix:
        test-suite: ['smoke', 'integration', 'security']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run ${{ matrix.test-suite }} tests
        run: |
          case "${{ matrix.test-suite }}" in
            "smoke")
              echo "🔥 Running smoke tests..."
              python -c "
              import sys
              sys.path.append('py')
              from copilot_delegation_agent import GitHubCopilotDelegationAgent
              agent = GitHubCopilotDelegationAgent()
              print('✅ Smoke test passed')
              "
              ;;
            "integration")
              echo "🔗 Running integration tests..."
              python py/mcp_tools_server.py &
              MCP_PID=\$!
              sleep 5
              curl -f http://localhost:8003/ || exit 1
              kill \$MCP_PID
              echo "✅ Integration test passed"
              ;;
            "security")
              echo "🔒 Running security scan..."
              pip install bandit
              python -m bandit -r py/ -ll || true
              echo "✅ Security scan completed"
              ;;
          esac

  # ========================================
  # 🐳 Multi-Platform Docker Build
  # ========================================
  docker-release:
    name: 🐳 Docker Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [prepare-release, pre-release-tests]
    if: needs.prepare-release.outputs.should-deploy == 'true'
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare-release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Cartrita V2 - AI Operating System
            org.opencontainers.image.description=Hybrid Fastify/FastAPI Architecture with MCP Copilot Delegation
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: packages/cartrita-v2
          file: packages/cartrita-v2/Dockerfile.python
          platforms: ${{ github.event.inputs.docker_platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.prepare-release.outputs.version }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Generate Docker image manifest
        run: |
          echo "# 🐳 Docker Release Manifest" > docker-manifest.md
          echo "" >> docker-manifest.md
          echo "## Images Built" >> docker-manifest.md
          echo "- **Registry**: ${{ env.REGISTRY }}" >> docker-manifest.md
          echo "- **Repository**: ${{ env.IMAGE_NAME }}" >> docker-manifest.md
          echo "- **Version**: ${{ needs.prepare-release.outputs.version }}" >> docker-manifest.md
          echo "- **Platforms**: ${{ github.event.inputs.docker_platforms || 'linux/amd64,linux/arm64' }}" >> docker-manifest.md
          echo "" >> docker-manifest.md
          echo "## Tags" >> docker-manifest.md
          echo '${{ steps.meta.outputs.tags }}' | while read tag; do
            if [[ -n "$tag" ]]; then
              echo "- \`$tag\`" >> docker-manifest.md
            fi
          done

      - name: Upload Docker manifest
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-manifest
          path: packages/cartrita-v2/docker-manifest.md

  # ========================================
  # 📦 Create GitHub Release
  # ========================================
  github-release:
    name: 📦 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare-release, pre-release-tests, docker-release]
    if: needs.prepare-release.outputs.should-deploy == 'true' && (github.event.inputs.create_github_release != 'false')
    defaults:
      run:
        working-directory: packages/cartrita-v2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Docker manifest
        uses: actions/download-artifact@v4
        with:
          name: docker-release-manifest
          path: ./

      - name: Create release assets
        run: |
          # Create release archive
          tar -czf cartrita-v2-${{ needs.prepare-release.outputs.version }}.tar.gz \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='htmlcov' \
            py/ \
            *.yml \
            *.json \
            *.md \
            Dockerfile.python \
            docker-compose.python-only.yml
          
          # Create checksums
          sha256sum cartrita-v2-${{ needs.prepare-release.outputs.version }}.tar.gz > checksums.txt
          
          # Create installation script
          cat > install.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Installing Cartrita V2 ${{ needs.prepare-release.outputs.version }}"
          
          # Check dependencies
          command -v python3 >/dev/null 2>&1 || { echo "❌ Python 3 required"; exit 1; }
          command -v docker >/dev/null 2>&1 || { echo "❌ Docker required"; exit 1; }
          
          # Download and extract
          wget -O cartrita-v2.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/cartrita-v2-${{ needs.prepare-release.outputs.version }}.tar.gz
          tar -xzf cartrita-v2.tar.gz
          
          echo "✅ Cartrita V2 installed successfully!"
          echo "Run 'docker-compose -f docker-compose.python-only.yml up' to start"
          EOF
          
          chmod +x install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: "🚀 Cartrita V2 ${{ needs.prepare-release.outputs.version }}"
          body: |
            ${{ needs.prepare-release.outputs.release-notes }}
            
            ---
            
            ## 📥 Installation
            
            ### Quick Start (Docker)
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare-release.outputs.tag }}/install.sh | bash
            ```
            
            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}
            ```
            
            ### Manual Installation
            1. Download `cartrita-v2-${{ needs.prepare-release.outputs.version }}.tar.gz`
            2. Extract and follow README instructions
            
            ## 🔍 Verification
            - SHA256: See `checksums.txt`
            - Docker images are signed and scanned for vulnerabilities
          prerelease: ${{ needs.prepare-release.outputs.is-prerelease }}
          files: |
            packages/cartrita-v2/cartrita-v2-${{ needs.prepare-release.outputs.version }}.tar.gz
            packages/cartrita-v2/checksums.txt
            packages/cartrita-v2/install.sh
            docker-manifest.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # 🚀 Production Deployment
  # ========================================
  production-deploy:
    name: 🚀 Production Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [prepare-release, docker-release, github-release]
    if: needs.prepare-release.outputs.should-deploy == 'true' && needs.prepare-release.outputs.is-prerelease == 'false'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "🚀 Deploying Cartrita V2 ${{ needs.prepare-release.outputs.version }} to production..."
          
          # Production deployment would go here
          # Examples:
          # - kubectl set image deployment/cartrita-backend cartrita=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }}
          # - helm upgrade cartrita ./helm-chart --set image.tag=${{ needs.prepare-release.outputs.version }}
          # - docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare-release.outputs.version }} cartrita_backend
          
          echo "✅ Production deployment completed successfully"

      - name: Post-deployment verification
        run: |
          echo "🔍 Running post-deployment verification..."
          
          # Health checks would go here
          # curl -f https://cartrita.production.example.com/health
          
          echo "✅ All services are healthy in production"

      - name: Notify deployment success
        run: |
          echo "🎉 Cartrita V2 ${{ needs.prepare-release.outputs.version }} successfully deployed to production!"

  # ========================================
  # 📊 Release Summary
  # ========================================
  release-summary:
    name: 📊 Release Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [prepare-release, pre-release-tests, docker-release, github-release, production-deploy]
    if: always()
    
    steps:
      - name: Generate release summary
        run: |
          echo "# 🚀 Cartrita V2 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Release Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.prepare-release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release:** ${{ needs.prepare-release.outputs.is-prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Images:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Preparation:** ${{ needs.prepare-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-Release Tests:** ${{ needs.pre-release-tests.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Build:** ${{ needs.docker-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Release:** ${{ needs.github-release.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Deploy:** ${{ needs.production-deploy.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📈 Overall Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
          # Add quick links
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.github-release.result }}" == "success" ]]; then
            echo "- [📦 Release Page](https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare-release.outputs.tag }})" >> $GITHUB_STEP_SUMMARY
            echo "- [🐳 Docker Images](${{ env.REGISTRY }}/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.production-deploy.result }}" == "success" ]]; then
            echo "- [🌐 Production Site](https://cartrita.production.example.com)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Release completion notification
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "🎉 Release pipeline completed successfully!"
            echo "Cartrita V2 ${{ needs.prepare-release.outputs.version }} is now available!"
          else
            echo "❌ Release pipeline encountered issues"
            echo "Please check the workflow logs for details"
          fi